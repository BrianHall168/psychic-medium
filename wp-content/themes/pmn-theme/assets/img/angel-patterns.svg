<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">Six angel number patterns</title><desc id="desc">Six repeated numbers surround a central pause symbol.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#21152f"/><stop offset="1" stop-color="#614579"/></linearGradient></defs><rect width="960" height="480" fill="url(#bg)"/><g stroke="#b79ac5" opacity=".6" stroke-width="2"><path d="M480 240L195 150"/><path d="M480 240L480 95"/><path d="M480 240L765 150"/><path d="M480 240L195 340"/><path d="M480 240L480 390"/><path d="M480 240L765 340"/></g><circle cx="195" cy="150" r="66" fill="#f7efe6" stroke="#c8acd2" stroke-width="3"/><text x="195" y="165" text-anchor="middle" fill="#563568" font-family="Georgia,serif" font-size="46">111</text><circle cx="480" cy="95" r="66" fill="#f7efe6" stroke="#c8acd2" stroke-width="3"/><text x="480" y="110" text-anchor="middle" fill="#563568" font-family="Georgia,serif" font-size="46">222</text><circle cx="765" cy="150" r="66" fill="#f7efe6" stroke="#c8acd2" stroke-width="3"/><text x="765" y="165" text-anchor="middle" fill="#563568" font-family="Georgia,serif" font-size="46">333</text><circle cx="195" cy="340" r="66" fill="#f7efe6" stroke="#c8acd2" stroke-width="3"/><text x="195" y="355" text-anchor="middle" fill="#563568" font-family="Georgia,serif" font-size="46">444</text><circle cx="480" cy="390" r="66" fill="#f7efe6" stroke="#c8acd2" stroke-width="3"/><text x="480" y="405" text-anchor="middle" fill="#563568" font-family="Georgia,serif" font-size="46">555</text><circle cx="765" cy="340" r="66" fill="#f7efe6" stroke="#c8acd2" stroke-width="3"/><text x="765" y="355" text-anchor="middle" fill="#563568" font-family="Georgia,serif" font-size="46">1111</text><circle cx="480" cy="240" r="68" fill="#d4b98f"/><text x="480" y="255" text-anchor="middle" fill="#30223d" font-family="Georgia,serif" font-size="46">Pause</text></svg>